<style>
.tracker-shell{--tracker-ink:#14213d;--tracker-muted:#6b7890;--tracker-line:#e8edf4;--tracker-teal:#1b6a64;--tracker-purple:#5b3a86;--tracker-orange:#bf651d}
.tracker-hero{background:linear-gradient(135deg,#14213d,#1b6a64);border-radius:18px;color:#fff;padding:24px 26px;margin-bottom:18px;box-shadow:0 10px 30px rgba(20,33,61,.12)}
.tracker-hero .eyebrow{color:#c9dfdb;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.tracker-hero h1{font-size:27px;margin:6px 0}.tracker-hero p{color:#d8e8e5;font-size:12px;margin:0;max-width:720px}
.tracker-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:end}.tracker-actions .form-label{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tracker-muted);display:block;margin-bottom:5px}.tracker-actions .form-select{min-width:105px;border-radius:9px;border-color:#dfe5ee;font-size:12px}.tracker-actions .btn{border-radius:9px;font-size:11px;font-weight:700}
.tracker-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.tracker-tabs .btn{border-radius:9px;font-size:11px;font-weight:700}.tracker-tabs .active{background:#1b6a64;color:#fff;border-color:#1b6a64}
.tracker-card{background:#fff;border:1px solid var(--tracker-line);border-radius:16px;padding:18px;box-shadow:0 4px 16px rgba(20,33,61,.035);height:100%}.tracker-card h3{font-size:15px;color:var(--tracker-ink);margin:0}.tracker-card h4{font-size:12px;margin:0;color:var(--tracker-ink)}.tracker-card .muted{font-size:11px;color:var(--tracker-muted)}
.tracker-kpi{background:#fff;border:1px solid var(--tracker-line);border-radius:14px;padding:17px;min-height:112px}.tracker-kpi .label{font-size:9px;color:#8792a5;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.tracker-kpi .value{display:block;color:var(--tracker-ink);font-size:24px;font-weight:800;margin-top:9px}.tracker-kpi .meta{font-size:10px;color:var(--tracker-muted);margin-top:3px}
.tracker-table{margin:0}.tracker-table th{font-size:9px;color:#8792a5;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;border-bottom:1px solid var(--tracker-line)}.tracker-table td{font-size:11px;color:#526074;vertical-align:middle;border-bottom:1px solid #f0f2f6}.tracker-table td strong{color:var(--tracker-ink);display:block}.tracker-table td small{color:#98a1af;display:block;margin-top:2px}.tracker-table .num{text-align:right;white-space:nowrap}.tracker-progress{background:#edf2f2;border-radius:99px;height:7px;min-width:90px;overflow:hidden}.tracker-progress span{display:block;background:#1b6a64;border-radius:inherit;height:100%}
.tracker-badge{border-radius:999px;font-size:9px;font-weight:800;padding:5px 8px}.tracker-badge.good{background:#e5f4ec;color:#24734f}.tracker-badge.warn{background:#fff4dc;color:#9a6a12}.tracker-badge.risk{background:#fde8e8;color:#a33b3b}
.tracker-chart{height:310px;position:relative}.tracker-chart-sm{height:260px;position:relative}
@media(max-width:700px){.tracker-hero h1{font-size:22px}.tracker-chart{height:260px}.tracker-table{min-width:920px}}
</style>
