<div class="col-12 col-md-6">

    <label for="{{ field.id_for_label }}"
           class="form-label fw-semibold">

        {{ field.label }}

        {% if field.field.required %}
            <span class="text-danger">*</span>
        {% endif %}

    </label>

    {{ field }}

    {% if field.help_text %}
        <div class="form-text">
            {{ field.help_text }}
        </div>
    {% endif %}

    {% if field.errors %}
        <div class="invalid-feedback d-block">
            {% for error in field.errors %}
                <div>{{ error }}</div>
            {% endfor %}
        </div>
    {% endif %}

</div>
