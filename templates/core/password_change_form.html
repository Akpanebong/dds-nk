{% extends 'base.html' %}
{% load static %}
{% block title %}Change Password | DDS-NK THRIVE{% endblock %}
{% block body %}
<div class="auth-shell">
    <div class="auth-card">
        <div class="login-logo"><img src="{% static 'img/dds_nk.jpg' %}" alt="DDS-NK THRIVE logo"></div>
        <p class="eyebrow">ACCOUNT SECURITY</p>
        <h1>Change your password</h1>
        <p class="muted">Choose a strong password you haven’t used elsewhere.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary w-100 mt-2"><i class="bi bi-key me-2"></i>Update password</button>
        </form>
        <div class="auth-footer"><a class="auth-link" href="{% url 'portal' %}">Cancel</a></div>
    </div>
</div>
{% endblock %}
